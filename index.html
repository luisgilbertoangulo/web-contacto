<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de contacto</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            margin: 0;
            padding: 40px 15px;
        }

        .contenedor {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
        }

        h1 {
            color: #2563eb;
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            margin-top: 20px;
            padding: 12px;
            width: 100%;
            background: #2563eb;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="contenedor">

        <h1>Contacta con nosotros</h1>

        <p>Rellena el siguiente formulario.</p>

        <form
            name="contacto"
            method="POST"
            data-netlify="true"
            action="/gracias"
        >

            <label>Nombre:</label>
            <input
                type="text"
                name="nombre"
                required
            >

            <label>Correo electrónico:</label>
            <input
                type="email"
                name="email"
                required
            >

            <label>Asunto:</label>
            <input
                type="text"
                name="asunto"
                required
            >

            <label>Mensaje:</label>
            <textarea
                name="mensaje"
                rows="5"
                required
            ></textarea>

            <button type="submit">
                Enviar mensaje
            </button>

        </form>

    </div>

</body>
</html>
